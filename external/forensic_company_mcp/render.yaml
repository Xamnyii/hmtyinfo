services:
  - type: web
    name: forensic-company-mcp
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn server:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: OPENSANCTIONS_API_KEY
        sync: false
      - key: MCP_ALLOWED_HOSTS
        sync: false
      - key: CORS_ORIGINS
        sync: false
